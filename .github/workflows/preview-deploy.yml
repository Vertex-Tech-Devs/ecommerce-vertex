name: PR Preview Deploy

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  checks: write
  contents: read
  deployments: write
  pull-requests: write

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  preview-deploy:
    name: Preview Deploy (Firebase Hosting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter & Tests
        run: |
          npm run lint
          npm run test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Build Storefront Application
        run: npm run build:dev-template

      - name: Check secret availability
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -n "$SA" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ Preview Deploy Skipped" >> $GITHUB_STEP_SUMMARY
            echo "El secreto \`FIREBASE_SERVICE_ACCOUNT_DEV\` no está configurado como **Repository Secret** en GitHub." >> $GITHUB_STEP_SUMMARY
            echo "Para habilitar las vistas previas efímeras en PRs, agrega \`FIREBASE_SERVICE_ACCOUNT_DEV\` en *Settings -> Secrets and variables -> Actions -> Repository secrets*." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Pre-seed Firestore PR Tenant Data
        if: steps.check.outputs.available == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          PR_NUMBER: ${{ github.event.number }}
          NODE_PATH: functions/node_modules
        run: |
          npm --prefix functions install
          npx tsx scripts/seed-pr-tenant.ts

      - name: Deploy to Firebase Hosting Preview Channel
        if: steps.check.outputs.available == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'
          projectId: 'ecommerce-vertex-dev'
          channelId: 'pr-${{ github.event.number }}'
          expires: 7d
