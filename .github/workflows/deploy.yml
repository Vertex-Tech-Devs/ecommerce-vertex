name: Deploy

on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  validate:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build production
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/ecommerce-vertex/browser
          retention-days: 1

  functions-build:
    name: Functions Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
        working-directory: functions

      - run: npm run build
        working-directory: functions

  deploy-dev:
    name: "→ Development"
    runs-on: ubuntu-latest
    needs: [unit-tests, build, functions-build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://ecommerce-vertex-dev.web.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Install root deps (needed for firebase predeploy hook: npm run build:fn)
      - run: npm ci

      # Install functions deps (needed for tsc during predeploy)
      - run: npm ci
        working-directory: functions

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'

      - name: Deploy to Firebase Development
        run: npx --yes firebase-tools deploy --project development --only hosting:ecommerce-vertex,functions

  deploy-prod:
    name: "→ Production"
    runs-on: ubuntu-latest
    needs: [unit-tests, build, functions-build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://ecommerce-vertex.web.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Install root deps (needed for firebase predeploy hook: npm run build:fn)
      - run: npm ci

      # Install functions deps (needed for tsc during predeploy)
      - run: npm ci
        working-directory: functions

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}'

      - name: Deploy to Firebase Production
        run: npx --yes firebase-tools deploy --project production --only hosting:ecommerce-vertex,functions
