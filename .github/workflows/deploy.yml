name: Deploy

on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm run test:ci

  build-dev:
    name: Build (Development)
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate development environment file
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          python3 << 'PYEOF'
          import os
          content = """export const environment = {{
            production: false,
            firebaseConfig: {{
              apiKey: "{apiKey}",
              authDomain: "{authDomain}",
              projectId: "{projectId}",
              storageBucket: "{storageBucket}",
              messagingSenderId: "{messagingSenderId}",
              appId: "{appId}",
              measurementId: "{measurementId}"
            }}
          }};""".format(
            apiKey=os.environ["FIREBASE_API_KEY"],
            authDomain=os.environ["FIREBASE_AUTH_DOMAIN"],
            projectId=os.environ["FIREBASE_PROJECT_ID"],
            storageBucket=os.environ["FIREBASE_STORAGE_BUCKET"],
            messagingSenderId=os.environ["FIREBASE_MESSAGING_SENDER_ID"],
            appId=os.environ["FIREBASE_APP_ID"],
            measurementId=os.environ.get("FIREBASE_MEASUREMENT_ID", "")
          )
          with open("src/environments/environment.ts", "w") as f:
            f.write(content)
          PYEOF

      - name: Build development
        run: npm run build:dev

      - uses: actions/upload-artifact@v4
        with:
          name: dist-dev-${{ github.sha }}
          path: dist/ecommerce-vertex/browser
          retention-days: 1

  build-prod:
    name: Build (Production)
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate production environment file
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          python3 << 'PYEOF'
          import os
          content = """export const environment = {{
            production: true,
            firebaseConfig: {{
              apiKey: "{apiKey}",
              authDomain: "{authDomain}",
              projectId: "{projectId}",
              storageBucket: "{storageBucket}",
              messagingSenderId: "{messagingSenderId}",
              appId: "{appId}",
              measurementId: "{measurementId}"
            }}
          }};""".format(
            apiKey=os.environ["FIREBASE_API_KEY"],
            authDomain=os.environ["FIREBASE_AUTH_DOMAIN"],
            projectId=os.environ["FIREBASE_PROJECT_ID"],
            storageBucket=os.environ["FIREBASE_STORAGE_BUCKET"],
            messagingSenderId=os.environ["FIREBASE_MESSAGING_SENDER_ID"],
            appId=os.environ["FIREBASE_APP_ID"],
            measurementId=os.environ.get("FIREBASE_MEASUREMENT_ID", "")
          )
          with open("src/environments/environment.prod.ts", "w") as f:
            f.write(content)
          PYEOF

      - name: Build production
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-prod-${{ github.sha }}
          path: dist/ecommerce-vertex/browser
          retention-days: 1

  functions-build:
    name: Functions Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci
        working-directory: functions

      - run: npm run build
        working-directory: functions

  deploy-dev:
    name: "→ Development"
    runs-on: ubuntu-latest
    needs: [unit-tests, build-dev, functions-build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://ecommerce-vertex-dev.web.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm ci
        working-directory: functions

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: dist-dev-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - name: Generate functions environment file
        env:
          MERCADOPAGO_ACCESSTOKEN: ${{ secrets.MERCADOPAGO_ACCESSTOKEN }}
          MERCADOPAGO_WEBHOOK_URL: ${{ secrets.MERCADOPAGO_WEBHOOK_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          cat > functions/.env.ecommerce-vertex-dev << EOF
          MERCADOPAGO_ACCESSTOKEN=${MERCADOPAGO_ACCESSTOKEN}
          MERCADOPAGO_WEBHOOK_URL=${MERCADOPAGO_WEBHOOK_URL}
          SITE_URL=${SITE_URL}
          EOF

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'

      - name: Deploy to Firebase Development
        run: npx --yes firebase-tools deploy --project development --only hosting:ecommerce-vertex,functions

  deploy-prod:
    name: "→ Production"
    runs-on: ubuntu-latest
    needs: [unit-tests, build-prod, functions-build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://ecommerce-vertex.web.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm ci
        working-directory: functions

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: dist-prod-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}'

      - name: Deploy to Firebase Production
        run: npx --yes firebase-tools deploy --project production --only hosting:ecommerce-vertex,functions
