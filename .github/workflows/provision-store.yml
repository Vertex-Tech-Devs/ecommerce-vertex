name: Provision Store

on:
  repository_dispatch:
    types: [provision-store]

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: "Deploy → ${{ github.event.client_payload.project_id }}"
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Write Firebase config
        env:
          FIREBASE_CONFIG_JSON: ${{ github.event.client_payload.firebase_config }}
        run: printf '%s' "$FIREBASE_CONFIG_JSON" > src/firebase-config.json

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}'

      - name: Deploy to Firebase Hosting
        env:
          TARGET_PROJECT: ${{ github.event.client_payload.project_id }}
        run: |
          npx --yes firebase-tools deploy \
            --project "$TARGET_PROJECT" \
            --only hosting \
            --non-interactive
