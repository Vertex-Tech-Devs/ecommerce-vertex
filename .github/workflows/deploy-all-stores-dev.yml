name: Deploy All Stores (Development)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PLATFORM_FUNCTIONS_URL: 'https://us-central1-vertex-platform-dev.cloudfunctions.net'

jobs:
  # ── 1. Build once ──────────────────────────────────────────────────────────
  build:
    name: Build template (dev)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]') || vars.AUTO_DEPLOY_ALL == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Lint & type check
        run: npm run lint && npm run typecheck

      - name: Build (development — template mode)
        run: |
          echo '{}' > src/firebase-config.json
          npm run build:dev-template

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-dev-${{ github.sha }}
          path: dist/ecommerce-vertex/browser
          retention-days: 1

  # ── 2. Fetch active dev stores ────────────────────────────────────────────
  get-stores:
    name: Get active dev stores
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC para autenticación automática con vertex-platform (sin secrets manuales)
      contents: read
    outputs:
      canary: ${{ steps.parse.outputs.canary }}
      rest: ${{ steps.parse.outputs.rest }}
      has_stores: ${{ steps.parse.outputs.has_stores }}
    steps:
      - name: Fetch OIDC token
        id: oidc
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('vertex-platform');
            core.setOutput('id_token', token);

      - name: Fetch from platform dev API
        id: fetch
        run: |
          # AUTOMATIZADO: id_token OIDC de GitHub Actions (validado por el platform).
          ID_TOKEN="${{ steps.oidc.outputs.id_token }}"
          RESPONSE=$(curl -s -X POST \
            "${{ env.PLATFORM_FUNCTIONS_URL }}/getActiveStores" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"idToken\":\"$ID_TOKEN\"}}")
          echo "response=$RESPONSE" >> "$GITHUB_OUTPUT"

      - name: Parse stores into canary + rest
        id: parse
        env:
          RESPONSE: ${{ steps.fetch.outputs.response }}
        run: |
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "API Error: $ERROR" >&2
            exit 1
          fi

          STORES=$(echo "$RESPONSE" | jq -c '[.result.stores[]? | select(.autoUpdate == true)]')
          COUNT=$(echo "$STORES" | jq 'length')

          if [ "$COUNT" -eq "0" ]; then
            echo "has_stores=false" >> "$GITHUB_OUTPUT"
            echo "canary=[]" >> "$GITHUB_OUTPUT"
            echo "rest=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_stores=true" >> "$GITHUB_OUTPUT"
            CANARY=$(echo "$STORES" | jq -c '[.[0]]')
            REST=$(echo "$STORES" | jq -c '.[1:]')
            echo "canary=$CANARY" >> "$GITHUB_OUTPUT"
            echo "rest=$REST" >> "$GITHUB_OUTPUT"
          fi

  # ── 3. Deploy canary first ────────────────────────────────────────────────
  deploy-canary:
    name: '🐤 Canary dev → ${{ matrix.store.storeName }}'
    runs-on: ubuntu-latest
    needs: [build, get-stores]
    if: needs.get-stores.outputs.has_stores == 'true'
    environment: development
    strategy:
      matrix:
        store: ${{ fromJson(needs.get-stores.outputs.canary) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-dev-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: functions

      - run: npm run build
        working-directory: functions

      - name: Inject firebase config
        env:
          FIREBASE_CONFIG_JSON: ${{ matrix.store.firebaseConfig }}
        run: printf '%s' "$FIREBASE_CONFIG_JSON" > dist/ecommerce-vertex/browser/firebase-config.json

      - name: Write minimal firebase.json for store deployment
        run: |
          python3 << 'PYEOF'
          import os, json
          site_id = os.environ.get("SITE_ID", "").strip()
          project_id = os.environ.get("PROJECT_ID", "").strip()
          payload = {
            "hosting": {
              "public": "dist/ecommerce-vertex/browser",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }]
            },
            "storage": {
              "rules": "storage.rules"
            },
            "functions": {
              "source": "functions",
              "runtime": "nodejs22"
            }
          }
          if site_id and site_id != "default":
              payload["hosting"]["site"] = site_id
          with open("firebase.json", "w") as f:
              json.dump(payload, f, indent=2)

          site_url = f"https://{site_id}.web.app" if site_id else "https://ecommerce-vertex.web.app"
          webhook_url = f"https://us-central1-{project_id}.cloudfunctions.net/mercadoPagoWebhookHandler" if project_id else ""
          with open("functions/.env", "w") as f:
              f.write(f"SITE_URL={site_url}\n")
              f.write(f"MERCADOPAGO_WEBHOOK_URL={webhook_url}\n")
          PYEOF
        env:
          SITE_ID: ${{ matrix.store.siteId }}
          PROJECT_ID: ${{ matrix.store.projectId }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'

      - name: Deploy
        run: |
          npx --yes firebase-tools deploy \
            --project ${{ matrix.store.projectId }} \
            --only hosting,firestore,storage,functions \
            --non-interactive

      - name: Health check (30s)
        run: |
          sleep 30
          URL="https://${{ matrix.store.siteId }}.web.app"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed: HTTP $STATUS for $URL"
            exit 1
          fi
          echo "✅ Health check passed: HTTP $STATUS for $URL"

  # ── 4. Deploy rest in parallel (only if canary passed) ───────────────────
  deploy-rest:
    name: '→ dev ${{ matrix.store.storeName }}'
    runs-on: ubuntu-latest
    needs: [build, get-stores, deploy-canary]
    if: needs.get-stores.outputs.rest != '[]' && needs.get-stores.outputs.rest != ''
    environment: development
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJson(needs.get-stores.outputs.rest) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-dev-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: functions

      - run: npm run build
        working-directory: functions

      - name: Inject firebase config
        env:
          FIREBASE_CONFIG_JSON: ${{ matrix.store.firebaseConfig }}
        run: printf '%s' "$FIREBASE_CONFIG_JSON" > dist/ecommerce-vertex/browser/firebase-config.json

      - name: Write minimal firebase.json for store deployment
        run: |
          python3 << 'PYEOF'
          import os, json
          site_id = os.environ.get("SITE_ID", "").strip()
          payload = {
            "hosting": {
              "public": "dist/ecommerce-vertex/browser",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }]
            },
            "storage": {
              "rules": "storage.rules"
            },
            "functions": {
              "source": "functions",
              "runtime": "nodejs22"
            }
          }
          if site_id and site_id != "default":
              payload["hosting"]["site"] = site_id
          with open("firebase.json", "w") as f:
              json.dump(payload, f, indent=2)
          PYEOF
        env:
          SITE_ID: ${{ matrix.store.siteId }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'

      - name: Deploy
        run: |
          npx --yes firebase-tools deploy \
            --project ${{ matrix.store.projectId }} \
            --only hosting,firestore,storage,functions \
            --non-interactive
