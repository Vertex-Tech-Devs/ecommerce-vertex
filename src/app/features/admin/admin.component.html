<div class="admin-shell" role="application" aria-label="Panel de administración">
  <app-sidebar [ngClass]="{'sidebar-open': isSidebarOpen}"
               [isOpen]="isSidebarOpen"
               (linkClicked)="closeSidebarOnOverlayClick()">
  </app-sidebar>

  <div class="admin-shell__main" [ngClass]="{'admin-shell__main--dimmed': isSidebarOpen}" (click)="closeSidebarOnOverlayClick()">
    <app-header (toggleSidebarEvent)="toggleSidebar()"></app-header>

    <main class="admin-shell__content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
