<header class="admin-header" role="banner">
  <div class="header__content">
    <div class="header__left">
      <button
        class="header__menu-toggle"
        (click)="onToggleSidebar($event)"
        aria-label="Abrir o cerrar menú lateral"
        type="button"
      >
        <i class="bi bi-list"></i>
      </button>
      <a routerLink="/admin/dashboard" class="header__welcome">Bienvenido</a>
    </div>

    <div class="header__right">
      <div class="header__user-menu">
        <button
          class="header__user-btn"
          type="button"
          id="userDropdown"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          aria-haspopup="true"
        >
          <span class="header__user-name">{{ userName$ | async }}</span>
          <i class="bi bi-person-circle header__user-icon"></i>
          <i class="bi bi-chevron-down header__caret"></i>
        </button>

        <ul class="dropdown-menu dropdown-menu-end header__dropdown" aria-labelledby="userDropdown">
          <div class="header__dropdown-wrapper">
            <div class="header__dropdown-content">
              <li>
                <a class="header__dropdown-item" routerLink="/admin/account">
                  <i class="bi bi-person-gear me-2"></i>Mi Perfil
                </a>
              </li>
              <li><hr class="header__dropdown-divider" /></li>
              <li>
                <button class="header__dropdown-item" type="button" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                </button>
              </li>
            </div>
          </div>
        </ul>
      </div>
    </div>
  </div>
</header>
