<div
  class="admin-pagination d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 py-3"
>
  <div class="admin-pagination__info d-flex align-items-center gap-3">
    <span class="text-muted small">
      Mostrando {{ startItem() }}–{{ endItem() }} de {{ totalItems() }} registros
    </span>

    <div class="admin-pagination__size d-flex align-items-center gap-2">
      <label class="text-muted small mb-0" for="adminPageSizeSelect">Por página:</label>
      <select
        id="adminPageSizeSelect"
        class="form-select form-select-sm admin-pagination__select"
        [value]="pageSize()"
        (change)="onSizeChange($event)"
      >
        @for (opt of pageSizeOptions(); track opt) {
          <option [value]="opt">{{ opt }}</option>
        }
      </select>
    </div>
  </div>

  @if (totalPages() > 1) {
    <nav class="admin-pagination__nav" aria-label="Navegación de páginas">
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="currentPage() <= 1">
          <button
            class="page-link"
            (click)="prevPage()"
            [disabled]="currentPage() <= 1"
            aria-label="Página anterior"
          >
            <i class="bi bi-chevron-left" aria-hidden="true"></i>
          </button>
        </li>

        @for (p of visiblePages(); track $index) {
          @if (p === '...') {
            <li class="page-item disabled">
              <span class="page-link">…</span>
            </li>
          } @else {
            <li class="page-item" [class.active]="p === currentPage()">
              <button
                class="page-link"
                (click)="onPageClick(p)"
                [attr.aria-current]="p === currentPage() ? 'page' : null"
              >
                {{ p }}
              </button>
            </li>
          }
        }

        <li class="page-item" [class.disabled]="currentPage() >= totalPages()">
          <button
            class="page-link"
            (click)="nextPage()"
            [disabled]="currentPage() >= totalPages()"
            aria-label="Página siguiente"
          >
            <i class="bi bi-chevron-right" aria-hidden="true"></i>
          </button>
        </li>
      </ul>
    </nav>
  }
</div>
