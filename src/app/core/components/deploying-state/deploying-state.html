<div
  class="deploying-container d-flex flex-column align-items-center justify-content-center min-vh-100 text-center p-4"
>
  <div class="deploying-card card border-0 shadow-sm p-4 p-md-5 rounded-4">
    <div class="deploying-icon-wrapper mb-4">
      <div
        class="spinner-border text-primary mb-3"
        role="status"
        style="width: 3.25rem; height: 3.25rem"
      >
        <span class="visually-hidden">Cargando...</span>
      </div>
      <div>
        <i class="bi bi-shield-check fs-2 text-primary" aria-hidden="true"></i>
      </div>
    </div>

    <h1 class="h3 fw-bold mb-3 text-dark">Estamos actualizando la tienda</h1>
    <p class="text-muted mb-4 fs-6">
      Estamos preparando mejoras para brindarte una experiencia más rápida y segura. Volveremos en
      unos instantes.
    </p>

    <div class="deploying-progress-wrapper mb-4">
      <div class="progress" style="height: 6px">
        <div
          class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
          style="width: 100%"
        ></div>
      </div>
    </div>

    <div class="d-flex justify-content-center gap-2">
      <button
        type="button"
        class="btn btn-outline-primary btn-sm px-4 rounded-pill"
        (click)="retry()"
      >
        <i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>Reintentar ahora
      </button>
    </div>
  </div>
</div>
